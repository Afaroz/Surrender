<!DOCTYPE html>

<title>Contact Us – Surrender Jeans</title>

<style>
body{
  margin:0;
  font-family: Arial, sans-serif;
  background:#f2f2f2;
  color:#222;
}

/* ===== HEADER ===== */
header{
  background:#111;
  color:#d4af37;
  padding:18px 14px;
  text-align:center;
}
header h1{
  margin:0;
  font-size:22px;
}
header p{
  margin-top:6px;
  font-size:14px;
  color:#eee;
}

/* ===== CONTACT CARD ===== */
.contact-card{
  background:#fff;
  margin:16px;
  padding:18px;
  border-radius:16px;
  box-shadow:0 6px 14px rgba(0,0,0,0.12);
}

.contact-item{
  display:flex;
  gap:12px;
  margin-bottom:14px;
  font-size:14px;
}
.contact-item span{
  font-size:18px;
}

/* ===== ACTION BUTTONS ===== */
.action-btns{
  display:flex;
  gap:10px;
  margin-top:16px;
}
.action-btns a{
  flex:1;
  text-align:center;
  padding:12px;
  border-radius:24px;
  font-size:14px;
  font-weight:600;
  text-decoration:none;
}
.call-btn{background:#ff9800;color:#111;}
.wa-btn{background:#25d366;color:#fff;}

/* ===== MAP ===== */
.map-box{
  margin:16px;
  border-radius:16px;
  overflow:hidden;
  box-shadow:0 6px 14px rgba(0,0,0,0.12);
}
.map-box iframe{
  width:100%;
  height:240px;
  border:0;
}

/* ===== FOOTER ===== */
footer{
  background:#111;
  color:#ccc;
  padding:18px 14px;
  text-align:center;
  font-size:13px;
}
footer p{margin:6px 0;}
footer a{
  color:#25d366;
  text-decoration:none;
  font-weight:600;
}

/* ===== MOBILE BAR ===== */
.mobile-bar{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:#fff;
  display:flex;
  justify-content:space-around;
  padding:10px 0;
  box-shadow:0 -4px 10px rgba(0,0,0,0.15);
}
.mobile-bar a{
  font-size:13px;
  font-weight:600;
  text-decoration:none;
}
.mobile-call{color:#ff5722;}
.mobile-wa{color:#25d366;}
.mobile-map{color:#2196f3;}

@media(min-width:768px){
  .mobile-bar{display:none;}
  header h1{font-size:28px;}
}


/* ===== BACK TO HOME ===== */
.back-home-wrapper{
  text-align:center;
  margin:20px 0 10px;
}

.back-home-btn{
  display:inline-block;
  padding:10px 22px;
  background:#111;
  color:#d4af37;
  border-radius:22px;
  font-size:13px;
  font-weight:600;
  text-decoration:none;
  box-shadow:0 4px 10px rgba(0,0,0,0.2);
}

.back-home-btn:hover{
  background:#000;
}

</style>
